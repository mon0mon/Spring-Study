<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <title>Chat Application</title>
</head>
<body>
<div class="container">
    <!-- 로그인 페이지 -->
    <div class="row justify-content-center">
        <div id="username-page" class="col-md-6">
            <h2 class="text-center mt-5">Login to Chat</h2>
            <form id="usernameForm" class="mt-3">
                <div class="mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="text" class="form-control" id="email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password:</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
        </div>
    </div>

    <!-- 채팅 페이지 -->
    <div id="chat-page" class="hidden">
        <div class="row">
            <!-- 채팅방 목록 -->
            <div class="col-md-4 users-list bg-primary text-white p-3">
                <h2>Chat Rooms</h2>
                <ul id="connectedUsers" class="list-unstyled"></ul>
                <div class="mt-3">
                    <p id="connected-user-username"></p>
                    <a class="logout text-white" href="javascript:void(0)" id="logout">Logout</a>
                </div>
            </div>
            <!-- 채팅 영역 -->
            <div class="col-md-8 chat-area p-3">
                <div id="chat-messages" class="mb-3" style="height:400px; overflow-y: auto;"></div>
                <form id="messageForm" class="hidden">
                    <div class="input-group">
                        <input autocomplete="off" type="text" id="message" class="form-control" placeholder="Type your message...">
                        <button class="btn btn-primary" type="submit">Send</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- STOMP, Bootstrap JS -->
<script src="js/main.js"></script>
<script type="text/javascript" src="js/stomp.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
