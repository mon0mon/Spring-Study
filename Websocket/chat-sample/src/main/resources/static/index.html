<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <title>Chat Application</title>
</head>
<body>
<div class="container">
    <!-- 로그인 페이지 -->
    <div class="row justify-content-center">
        <div id="login-page" class="col-md-6">
            <h2 class="text-center mt-5">Login to Chat</h2>
            <form id="usernameForm" class="mt-3">
                <div class="mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="text" class="form-control" id="email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password:</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
        </div>
    </div>

    <!-- 채팅 페이지 -->
    <div id="chat-page" class="hidden">
        <div class="row">
            <!-- 채팅방 목록 -->
            <div class="col-md-4 users-list bg-primary text-white p-3">
                <h2>Chat Rooms</h2>
                <ul id="connectedUsers" class="list-unstyled"></ul>
                <!-- 수정된 프로필 영역 -->
                <div class="mt-3 d-flex align-items-center">
                    <img src="img/user_icon.png" alt="User Icon" class="user-profile-img">
                    <p id="connected-user-username" class="ms-2 mb-0"></p>
                    <a class="logout text-white ms-auto" href="javascript:void(0)" id="logout">Logout</a>
                </div>
            </div>
            <!-- 채팅 영역 -->
            <div class="col-md-8 chat-area p-3">
                <div id="chat-messages" class="mb-3" style="height:400px; overflow-y: auto;"></div>
                <form id="messageForm" class="hidden">
                    <div class="input-group">
                        <input autocomplete="off" type="text" id="message" class="form-control" placeholder="Type your message...">
                        <button class="btn btn-primary" type="submit">Send</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- STOMP, Bootstrap JS -->
<script src="js/main.js"></script>
<script type="text/javascript" src="js/stomp.js"></script>
<script type="text/javascript" src="js/bootstrap.bundle.min.js"></script>
<!-- 페이지 로드시 쿠키의 accessToken 값 여부에 따라 화면 전환 -->
<script>
    window.addEventListener("load", function() {
        // main.js에 이미 getCookie 함수가 정의되어 있으므로 사용
        const token = getCookie("accessToken");
        if (token) {
            // accessToken이 있으면 로그인 페이지 숨기고 채팅 페이지를 표시
            showChatPage();
            // 채팅방 목록을 가져오는 함수 호출 (main.js에 정의)
            if (typeof findAndDisplayChatRooms === "function") {
                findAndDisplayChatRooms();
            }
        } else {
            // accessToken이 없으면 로그인 페이지 표시
            showLoginPage();
        }
    });
</script>
</body>
</html>
