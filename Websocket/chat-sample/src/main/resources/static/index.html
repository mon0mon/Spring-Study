<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>채팅 애플리케이션</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 커스텀 CSS -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="container-fluid vh-100 p-3">
    <!-- 로그인 페이지 -->
    <div id="login-page" class="row justify-content-center align-items-center h-100">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4">로그인</h2>
                    <form id="usernameForm">
                        <div class="mb-3">
                            <label for="email" class="form-label">이메일:</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">비밀번호:</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">로그인</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 채팅 페이지 -->
    <div id="chat-page" class="row h-100 hidden">
        <!-- 좌측 채팅방 목록 -->
        <div class="col-md-4 d-flex flex-column p-0 h-100">
            <div class="card h-100">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">ChatRooms</h3>
                </div>
                <div class="card-body p-0 overflow-auto flex-grow-1">
                    <ul id="connectedUsers" class="list-group list-group-flush">
                        <!-- 채팅방 목록이 여기에 동적으로 추가됩니다 -->
                    </ul>
                </div>
                <div class="card-footer bg-light">
                    <div class="d-flex align-items-center">
                        <img src="img/user_icon.png" alt="User Profile" class="user-profile-img me-2">
                        <span id="connected-user-username" class="me-auto">User1</span>
                        <button id="logout" class="btn btn-outline-secondary btn-sm">LOGOUT</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 우측 채팅 영역 -->
        <div class="col-md-8 d-flex flex-column h-100 ps-md-3 mt-3 mt-md-0">
            <div class="card h-100">
                <div class="card-header bg-light d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center">
                        <img src="img/user_icon.png" alt="Room Icon" class="user-profile-img me-2" style="width: 30px; height: 30px;">
                        <h5 id="current-room" class="mb-0">ChatRoom-1</h5>
                        <span class="ms-2 text-muted">2</span>
                    </div>
                    <div class="connection-status">
                        <button id="connect" class="btn btn-success">Connected</button>
                        <button id="disconnect" class="btn btn-danger hidden">Disconnected</button>
                    </div>
                </div>
                <div class="card-body p-3 overflow-auto" style="background-color: #f8f9fa;">
                    <div id="chat-messages" class="d-flex flex-column">
                        <!-- 채팅 메시지가 여기에 동적으로 추가됩니다 -->
                    </div>
                </div>
                <div class="card-footer bg-light">
                    <form id="messageForm" class="d-flex">
                        <input type="text" id="message" class="form-control me-2" placeholder="메시지를 입력하세요...">
                        <button type="submit" class="btn btn-primary">SEND</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- STOMP JS -->
<script src="js/stomp.js"></script>
<!-- 메인 JS -->
<script src="js/main.js"></script>
</body>
</html>
