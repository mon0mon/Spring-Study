<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>채팅 애플리케이션</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 커스텀 CSS -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="container-fluid vh-100 p-3">
    <!-- 로그인 페이지 -->
    <div id="login-page" class="row justify-content-center align-items-center h-100">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4">Login</h2>
                    <form id="usernameForm">
                        <div class="mb-3">
                            <label for="email" class="form-label">email</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 채팅 페이지 -->
    <div id="chat-page" class="row h-100 hidden">
        <!-- 좌측 채팅방 목록 -->
        <div class="col-md-4 d-flex flex-column p-0 h-100">
            <div class="card h-100">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">ChatRooms</h3>
                </div>
                <div class="card-body p-0 overflow-auto flex-grow-1">
                    <ul id="connectedUsers" class="list-group list-group-flush">
                        <!-- 채팅방 목록이 여기에 동적으로 추가됩니다 -->
                    </ul>
                </div>
                <div class="card-footer bg-light">
                    <div class="d-flex align-items-center">
                        <img src="img/user_icon.png" alt="User Profile" class="user-profile-img me-2">
                        <span id="connected-user-username" class="me-auto">DefaultUser</span>
                        <button id="logout" class="btn btn-outline-secondary btn-sm">LOGOUT</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 우측 채팅 영역 -->
        <div class="col-md-8 d-flex flex-column h-100 ps-md-3 mt-3 mt-md-0">
            <div class="card h-100">
                <div class="card-header bg-light d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center">
                        <h5 id="current-room" class="mb-0">ChatRoom-1</h5>
                        <span id="current-room-participants-count" class="ms-2 text-muted">100</span>
                    </div>
                    <div class="connection-status">
                        <button id="connect" class="btn btn-success">Connect</button>
                        <button id="disconnect" class="btn btn-danger hidden">Disconnect</button>
                    </div>
                </div>
                <div class="card-body p-3 overflow-auto" style="background-color: #f8f9fa;">
                    <div id="chat-messages" class="d-flex flex-column">
                        <!-- 채팅 메시지가 여기에 동적으로 추가됩니다 -->
                    </div>
                </div>
                <div class="card-footer bg-light">
                    <form id="messageForm" class="d-flex">
                        <input type="text" id="message" class="form-control me-2" placeholder="Type a message">
                        <button type="submit" class="btn btn-primary">SEND</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- SVG 심볼 정의 (d-none 클래스로 숨김 처리) -->
    <svg xmlns="http://www.w3.org/2000/svg" class="d-none">
        <symbol id="check-circle-fill" viewBox="0 0 16 16">
            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
        </symbol>
        <symbol id="info-fill" viewBox="0 0 16 16">
            <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zm.93-9.412-1 4.705c-.07.34.029.533.304.533.194 0 .487-.07.686-.246l-.088.416c-.287.346-.92.598-1.465.598-.703 0-1.002-.422-.808-1.319l.738-3.468c.064-.293.006-.399-.287-.47l-.451-.081.082-.381 2.29-.287zM8 5.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/>
        </symbol>
        <symbol id="exclamation-triangle-fill" viewBox="0 0 16 16">
            <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
        </symbol>
    </svg>

    <!-- Alert 메시지를 삽입할 컨테이너 -->
    <div id="alert-container" class="position-fixed top-0 end-0 m-3" style="z-index: 1050;"></div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- STOMP JS -->
<script src="js/stomp.js"></script>
<!-- 메인 JS -->
<script src="js/main.js"></script>
</body>
</html>
